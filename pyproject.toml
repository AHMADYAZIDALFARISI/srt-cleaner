[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-cleaner"
version = "0.1.0"
description = "CLI pembersih file subtitle SRT: buang tag, deskripsi non-dialog, label pembicara, duplikat, dan perbaiki waktu. Offline, tanpa dependensi."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AHMADYAZIDALFARISI"}]
keywords = ["srt", "subtitle", "cleaner", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
srtclean = "srtclean.cli:entry"

[tool.setuptools.packages.find]
include = ["srtclean"]
